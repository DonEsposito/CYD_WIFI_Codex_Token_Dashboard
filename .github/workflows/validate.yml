name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/requirements.txt

      - name: Install tools and host dependencies
        run: python -m pip install platformio -r host/requirements.txt

      - name: Validate host
        run: |
          python -m py_compile host/collector.py host/codex_usage.py host/serial_device.py
          python host/collector.py --help

      - name: Build firmware
        run: platformio run
